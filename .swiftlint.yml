included:
  - MovieApp
  - MovieAppTests
  - Modules

excluded:
  - DerivedData
  - build
  - .build
  - Modules/Networking/.build

disabled_rules:
  - discarded_notification_center_observer
  - notification_center_detachment
  - orphaned_doc_comment

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - convenience_type
  - discouraged_object_literal
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - implicitly_unwrapped_optional
  - indentation_width
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - private_over_fileprivate
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_self_in_closure
  - redundant_type_annotation
  - sorted_imports
  - strict_fileprivate
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - weak_delegate
  - yoda_condition

attributes:
  always_on_same_line:
    - "@IBSegueAction"
    - "@IBAction"
    - "@NSManaged"
    - "@objc"

force_cast: error
force_try: error
force_unwrapping: error
implicitly_unwrapped_optional: error

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 400
  error: 600

cyclomatic_complexity:
  warning: 10
  error: 20

nesting:
  type_level: 3

identifier_name:
  excluded:
    - i
    - id
    - x
    - y
    - z

implicit_return:
  included:
    - closure
    - getter

indentation_width:
  indentation_width: 4
  include_comments: false

line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

multiline_arguments:
  first_argument_location: next_line
  only_enforce_after_first_closure_on_first_line: true

private_over_fileprivate:
  validate_extensions: true

trailing_whitespace:
  ignores_empty_lines: false
  ignores_comments: true

vertical_whitespace:
  max_empty_lines: 1

custom_rules:
  no_swiftui:
    name: "UIKit Only"
    regex: '^\s*import\s+SwiftUI\b'
    message: "Project is UIKit only. Do not import SwiftUI."
    severity: error
  no_combine:
    name: "No Combine"
    regex: '^\s*import\s+Combine\b'
    message: "Use async/await, AsyncSequence or AsyncStream instead of Combine."
    severity: error
  no_dispatch_queue:
    name: "No GCD"
    regex: '\bDispatchQueue\.(main|global)\b'
    message: "Use Swift Concurrency (Task, actors, @MainActor) instead of GCD."
    severity: warning
  no_storyboard_or_nib:
    name: "Programmatic UI"
    regex: '\b(UIStoryboard|UINib)\s*\(|instantiateViewController\(|@IBOutlet|@IBAction'
    message: "Build UI in code. No storyboards, nibs or Interface Builder outlets."
    severity: error
  no_print:
    name: "No print"
    regex: '^\s*(debugPrint|print)\s*\('
    message: "Use os.Logger instead of print."
    severity: warning
  no_networking_outside_data:
    name: "Networking stays behind the repositories"
    included: 'MovieApp/(Domain|Scenes|Common)/.*\.swift'
    regex: '^\s*(@testable\s+)?import\s+Networking\b'
    message: "Only Data/Repositories and App import Networking. Use the Domain ports."
    severity: error
